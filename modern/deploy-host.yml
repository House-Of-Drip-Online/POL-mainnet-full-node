---
- name: Install the immutable Polygon node release on an authorized host
  hosts: polygon_node
  become: true
  gather_facts: true
  tasks:
    - name: Require Ubuntu 24.04 and the exact deployment settings
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version == '24.04'
          - ansible_architecture == 'x86_64'
          - node_settings is defined
          - node_settings.volumeId is defined
          - node_settings.privateIp is defined
          - node_settings.sourceCommit is match('^[0-9a-f]{40}$')
    - name: Install distro-maintained runtime dependencies
      ansible.builtin.apt:
        update_cache: true
        name: [ca-certificates, curl, xfsprogs, lz4, python3, python3-aiohttp, python3-tomlkit, python3-boto3, sudo]
        state: present
    - name: Create unprivileged RPC user
      ansible.builtin.user:
        name: omega-rpc
        system: true
        create_home: false
        shell: /usr/sbin/nologin
        group: nogroup
    - name: Create installation paths
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0755'
      loop: [/opt/omega-polygon/modern, /etc/omega-polygon, /run/omega-polygon]
    - name: Copy the reviewed modern source
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/'
        dest: /opt/omega-polygon/modern/
        owner: root
        group: root
        mode: preserve
    - name: Install non-secret node settings
      ansible.builtin.copy:
        content: '{{ node_settings | to_nice_json }}'
        dest: /etc/omega-polygon/settings.json
        owner: root
        group: root
        mode: '0644'
    - name: Bootstrap the explicit EBS volume and verified node packages
      ansible.builtin.command:
        argv: [/usr/bin/python3, /opt/omega-polygon/modern/bootstrap.py]
      async: 21600
      poll: 0
