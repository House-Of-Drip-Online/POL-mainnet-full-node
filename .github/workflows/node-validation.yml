name: Polygon node source validation
on:
  push:
    paths: ['modern/**', '.github/workflows/node-validation.yml']
  pull_request:
    paths: ['modern/**', '.github/workflows/node-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modern/requirements-dev.txt
      - run: pip install -r modern/requirements-dev.txt
      - run: python -m unittest discover -s modern/tests -v
      - run: cfn-lint modern/aws/node.yaml
      - run: ansible-playbook --syntax-check -i 'polygon_node,' modern/deploy-host.yml
